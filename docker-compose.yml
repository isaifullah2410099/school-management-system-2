services:
  app:
    image: php:8.3-apache
    ports:
      - "8081:80"
    volumes:
      - ./school-management-system:/var/www/html
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: ''
      DB_NAME: sms_db
    command: bash -lc "docker-php-ext-install pdo_mysql && apache2-foreground"

  db:
    image: mysql:8.0
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_DATABASE: sms_db
    volumes:
      - db_data:/var/lib/mysql
      - ./school-management-system/sms_db.sql:/docker-entrypoint-initdb.d/sms_db.sql:ro

volumes:
  db_data: {}
